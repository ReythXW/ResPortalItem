# ResExtraFlags
#
# 本插件给 Residence 补充/改写以下领地 flag：
#
#   portalitem        非玩家实体（掉落物等）穿门时能在领地内创建对面的门
#   animals           【已改写】只控制友好生物的自然刷新（自然/区块生成）
#   wanderingtrader   流浪商人 / 商人羊驼的刷新
#   specialanimals    其余非自然来源的友好生物刷新（繁殖、治愈、铁傀儡等）
#
# 生成权限的默认值都是「允许」（和 Residence 默认一致）：
#   没显式设置过的领地，自然刷新、流浪商人、特殊刷新都放行。
#   想禁止必须显式设为 false。
#
# 旧的 canimals / nanimals / sanimals 已由本插件接管并从 GUI 隐藏，
# 设置它们不再影响生成。请改用上面三个新 flag。
#
# 玩家本人穿过地狱门的行为完全不受本插件影响，仍然由 Residence 按 build 判定。

# ===== portalitem 相关 =====
# 只放行掉落物（Item 实体）。
# true  = 只有掉落物能触发（推荐）
# false = 所有非玩家实体都能触发，包括僵尸猪灵之类的怪物
only-items: true

# 危险开关：true 时任何非玩家实体都能在"任意领地"建门，
# 完全忽略 portalitem flag 和 build flag。正常情况保持 false。
# 注意：此开关只影响建门，不影响上面的三个生物刷新权限。
global-allow: false
